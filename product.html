<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج - متجر كساء</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- مكتبة AOS للتنقلات -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <style>
        .product-details-container { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 40px; 
            padding: 50px 0; 
            align-items: flex-start;
        }

        /* --- تصميم سلايدر الصور --- */
        .image-gallery-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        .main-image-wrapper {
            position: relative;
            width: 100%;
            height: 480px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .details-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* أسهم السلايدر */
        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.85);
            color: #1e293b;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
            z-index: 5;
        }

        .slider-arrow:hover {
            background: #ffffff;
            transform: translateY(-50%) scale(1.1);
        }

        .slider-arrow.prev { right: 12px; }
        .slider-arrow.next { left: 12px; }

        /* معرض الصور المصغرة Thumbnails */
        .thumbnails-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .thumbnail-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.6;
            transition: all 0.2s ease;
        }

        .thumbnail-img.active,
        .thumbnail-img:hover {
            opacity: 1;
            border-color: var(--cherry-blossom-pink, #f472b6);
        }

        .details-info { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        .product-description-text {
            color: #555;
            line-height: 1.8;
            font-size: 16px;
            white-space: pre-line;
        }

        /* اختيار المقاسات */
        .size-selection-box {
            background: rgba(248, 250, 252, 0.8);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            backdrop-filter: blur(8px);
        }

        .size-box-title {
            font-size: 15px;
            font-weight: 700;
            color: #334155;
        }

        .size-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .size-btn-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            cursor: pointer;
            background: #ffffff;
            transition: all 0.3s ease;
            position: relative;
        }

        .size-btn-label input[type="radio"] {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }

        .size-name { font-size: 16px; font-weight: 700; color: #1e293b; }
        .size-weight { font-size: 12px; color: #64748b; margin-top: 4px; font-weight: 600; }

        .size-btn-label:has(input[type="radio"]:checked) {
            border-color: var(--cherry-blossom-pink, #f472b6);
            background: rgba(244, 114, 182, 0.08);
            box-shadow: 0 4px 12px rgba(244, 114, 182, 0.2);
            transform: translateY(-2px);
        }

        /* 🌙 Dark Mode */
        body.dark-mode .size-selection-box {
            background: rgba(30, 41, 59, 0.7) !important;
            border-color: #334155 !important;
        }
        body.dark-mode .size-box-title { color: #f1f5f9 !important; }
        body.dark-mode .size-btn-label { background: #0f172a !important; border-color: #334155 !important; }
        body.dark-mode .size-name { color: #f8fafc !important; }
        body.dark-mode .size-weight { color: #94a3b8 !important; }
        body.dark-mode .product-description-text { color: #cbd5e1 !important; }
        body.dark-mode .slider-arrow { background: rgba(30, 41, 59, 0.85); color: #fff; }

        .related-products-section {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 2px dashed #e2e8f0;
        }

        @media (max-width: 768px) { 
            .product-details-container { grid-template-columns: 1fr; gap: 25px; } 
            .main-image-wrapper { height: 350px; } 
        }
    </style>
</head>
<body>

    <header>
        <div class="container navbar">
            <div class="logo">
                <img src="/imges/PNG.Logo.JPG.jpeg" alt="متجر كساء" class="logo-img">
            </div>
            <nav>
                <a href="/">← العودة للمتجر الرئيسي</a>
            </nav>
        </div>
    </header>

    <main class="container product-details-container">
        <!-- السلايدر والمعرض -->
        <div class="image-gallery-container">
            <div class="main-image-wrapper">
                <button class="slider-arrow prev" id="slider-prev" style="display: none;">❮</button>
                <img id="product-detail-img" src="" alt="جاري التحميل..." class="details-img">
                <button class="slider-arrow next" id="slider-next" style="display: none;">❯</button>
            </div>
            <div class="thumbnails-container" id="thumbnails-container"></div>
        </div>

        <div class="details-info">
            <h1 id="product-detail-name" style="font-size: 32px;">جاري تحميل المنتج... </h1>
            <p id="product-detail-price" class="price" style="font-size: 26px;"></p>
            
            <p id="product-detail-description" class="product-description-text"></p>
            
            <div class="size-selection-box">
                <span class="size-box-title">📏 اختاري المقاس المناسب لكِ:</span>
                <div class="size-options">
                    <label class="size-btn-label">
                        <input type="radio" name="product-size" value="Size 1" checked>
                        <span class="size-name">Size 1</span>
                        <span class="size-weight">يلائم  الي 65 كجم</span>
                    </label>
                    <label class="size-btn-label">
                        <input type="radio" name="product-size" value="Size 2">
                        <span class="size-name">Size 2</span>
                        <span class="size-weight">يلائم  الي 85 كجم</span>
                    </label>
                </div>
            </div>

            <button id="detail-add-btn" class="add-to-cart-btn" style="width: fit-content; padding: 14px 40px; font-size: 16px; border-radius: 10px;">
                إضافة إلى سلة المشتريات 🛍️
            </button>
        </div>
    </main>

    <section class="container related-products-section">
        <h2 class="section-title" style="margin-bottom: 30px;">منتجات أخرى قد تعجبكِ </h2>
        <div id="other-products-grid" class="products-grid"></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>

    <script>
        const SUPABASE_URL = "https://sdjvnkrmfelgtypogttx.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_Ox-6-5PCOYhIPRG3DZ0CuQ_1q05COmH"; 
        const SupabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentProduct = null;
        let productImages = [];
        let currentImageIndex = 0;

        if (typeof AOS !== 'undefined') AOS.init({ duration: 800, once: true });
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

        function addToCart(product, selectedSize = 'Size 1') {
            let cart = JSON.parse(localStorage.getItem('kesaa_cart')) || [];
            const existing = cart.find(item => item.id === product.id && item.size === selectedSize);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: Number(product.price),
                    size: selectedSize,
                    quantity: 1
                });
            }

            localStorage.setItem('kesaa_cart', JSON.stringify(cart));
            alert(`تمت إضافة "${product.name}" (مقاس: ${selectedSize}) إلى السلة بنجاح! 🎉`);
        }

        // تشغيل السلايدر
        function setupGallery(images) {
            productImages = images;
            currentImageIndex = 0;

            const mainImg = document.getElementById('product-detail-img');
            const thumbnailsContainer = document.getElementById('thumbnails-container');
            const prevBtn = document.getElementById('slider-prev');
            const nextBtn = document.getElementById('slider-next');

            thumbnailsContainer.innerHTML = '';

            if (images.length > 1) {
                prevBtn.style.display = 'flex';
                nextBtn.style.display = 'flex';

                images.forEach((imgUrl, idx) => {
                    const thumb = document.createElement('img');
                    thumb.src = imgUrl;
                    thumb.className = `thumbnail-img ${idx === 0 ? 'active' : ''}`;
                    thumb.addEventListener('click', () => switchImage(idx));
                    thumbnailsContainer.appendChild(thumb);
                });
            } else {
                prevBtn.style.display = 'none';
                nextBtn.style.display = 'none';
            }

            mainImg.src = images[0] || '';

            prevBtn.onclick = () => switchImage((currentImageIndex - 1 + images.length) % images.length);
            nextBtn.onclick = () => switchImage((currentImageIndex + 1) % images.length);
        }

        function switchImage(index) {
            currentImageIndex = index;
            const mainImg = document.getElementById('product-detail-img');
            mainImg.style.opacity = '0.3';
            
            setTimeout(() => {
                mainImg.src = productImages[currentImageIndex];
                mainImg.style.opacity = '1';
            }, 150);

            const thumbs = document.querySelectorAll('.thumbnail-img');
            thumbs.forEach((t, idx) => {
                t.classList.toggle('active', idx === currentImageIndex);
            });
        }

        async function loadProductAndOthers() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) return;

            try {
                const { data: product, error } = await SupabaseClient
                    .from('products')
                    .select('*')
                    .eq('id', productId)
                    .single();

                if (error || !product) throw error;

                currentProduct = product;
                document.title = `${product.name} - متجر كساء`;
                document.getElementById('product-detail-name').textContent = product.name;
                document.getElementById('product-detail-price').textContent = `${product.price} ج.م`;
                document.getElementById('product-detail-description').textContent = product.description || product.desc || 'خامة فاخرة ومصممة بعناية فائقة لتناسب إطلالتكِ اليومية والمناسبات بكل راحة وأناقة.';

                // تجميع الصور (سواء صورة واحدة أو عدة صور)
                let imgs = [];
                if (product.images && Array.isArray(product.images) && product.images.length > 0) {
                    imgs = product.images;
                } else if (typeof product.img === 'string' && product.img.includes(',')) {
                    imgs = product.img.split(',').map(s => s.trim());
                } else if (product.img) {
                    imgs = [product.img];
                } else {
                    imgs = ['/imges/placeholder.jpg'];
                }

                setupGallery(imgs);

                const addBtn = document.getElementById('detail-add-btn');
                if (product.stock !== undefined && product.stock <= 0) {
                    addBtn.disabled = true;
                    addBtn.textContent = 'نفذت الكمية ⚠️';
                    addBtn.style.background = '#cbd5e1';
                }

                loadOtherProducts(productId);

            } catch (err) {
                console.error("خطأ في جلب بيانات المنتج:", err);
            }
        }

        async function loadOtherProducts(currentId) {
            const grid = document.getElementById('other-products-grid');
            if (!grid) return;

            try {
                const { data: products } = await SupabaseClient
                    .from('products')
                    .select('*')
                    .neq('id', currentId)
                    .order('created_at', { ascending: false });

                if (!products || products.length === 0) return;

                grid.innerHTML = '';
                products.forEach((p) => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.setAttribute('data-aos', 'zoom-in');

                    const isOutOfStock = p.stock !== undefined && p.stock <= 0;

                    // استخراج الصورة الأولى بكفاءة
                    let cardImg = '';
                    if (Array.isArray(p.images) && p.images.length > 0) {
                        cardImg = p.images[0];
                    } else if (typeof p.img === 'string') {
                        cardImg = p.img.split(',')[0].trim();
                    }

                    card.innerHTML = `
                        <a href="/product.html?id=${p.id}">
                            <img src="${cardImg}" alt="${p.name}" class="product-img">
                        </a>
                        <div class="product-info">
                            <h3>${p.name}</h3>
                            <p class="price">${p.price} ج.م</p>
                            <div class="size-selector-container" style="margin: 8px 0; display: flex; align-items: center; justify-content: center; gap: 8px;">
                                <label style="font-size: 12px; font-weight: 600;">المقاس:</label>
                                <select id="other-size-${p.id}" class="product-size-select" style="padding: 4px 8px; font-size: 12px;">
                                    <option value="Size 1">Size 1</option>
                                    <option value="Size 2">Size 2</option>
                                </select>
                            </div>
                            ${isOutOfStock 
                                ? `<button class="add-to-cart-btn" disabled style="background:#cbd5e1;">نفذت الكمية ⚠️</button>`
                                : `<button class="add-to-cart-btn other-add-btn" data-id="${p.id}">إضافة للسلة 🛍️</button>`
                            }
                        </div>
                    `;

                    const btn = card.querySelector('.other-add-btn');
                    if (btn) {
                        btn.addEventListener('click', () => {
                            const sizeSelect = document.getElementById(`other-size-${p.id}`);
                            addToCart(p, sizeSelect ? sizeSelect.value : 'Size 1');
                        });
                    }

                    grid.appendChild(card);
                });

                if (typeof AOS !== 'undefined') AOS.refresh();

            } catch (err) {
                console.error("خطأ في جلب المنتجات الأخرى:", err);
            }
        }

        document.getElementById('detail-add-btn').addEventListener('click', () => {
            if (currentProduct) {
                const selectedRadio = document.querySelector('input[name="product-size"]:checked');
                addToCart(currentProduct, selectedRadio ? selectedRadio.value : 'Size 1');
            }
        });

        loadProductAndOthers();
    </script>
</body>
</html>
