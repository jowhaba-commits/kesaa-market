<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>سياسة الاسترجاع والاستبدال | Kesaa Store</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #ffffff !important;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px;
        }

        .policy-container {
            width: 100%;
            max-width: 520px;
            background-color: #ffffff !important;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
        }

        .header-section {
            text-align: center;
            margin-bottom: 28px;
        }

        /* تنسيق اللوجو */
        .brand-logo {
            max-width: 120px;
            height: auto;
            margin-bottom: 12px;
            object-fit: contain;
            display: inline-block;
        }

        .header-section h1 {
            font-size: 1.45rem;
            font-weight: 800;
            color: #0f172a;
        }

        .policy-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
        }

        .policy-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background-color: #f8fafc;
            border: 1px solid #f1f5f9;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #334155;
        }

        .policy-item.warning {
            border-right: 3.5px solid #ef4444;
            background-color: #fef2f2;
        }

        .icon-circle {
            width: 36px;
            height: 36px;
            background-color: #fdf2f8;
            color: #f472b6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .policy-item.warning .icon-circle {
            background-color: #ffe4e6;
            color: #ef4444;
        }

        .typing-cursor {
            border-left: 2px solid #f472b6;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .brand-logo{
            border-radius: 70px;
        }

        .guarantee-banner {
            text-align: center;
            padding-top: 18px;
            border-top: 1px dashed #e2e8f0;
            color: #f472b6;
            font-weight: 700;
            font-size: 0.92rem;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .back-btn-wrapper {
            text-align: center;
            margin-top: 20px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 24px;
            background-color: transparent;
            color: #0f172a;
            border: 1.5px solid #e2e8f0;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            background-color: #f472b6;
            color: #ffffff;
            border-color: #f472b6;
            box-shadow: 0 8px 18px rgba(244, 114, 182, 0.3);
        }

        .back-btn:active {
            transform: scale(0.97);
            box-shadow: 0 0 10px #f472b6, 0 0 25px #f472b6 !important;
        }

        @media (max-width: 480px) {
            .policy-container {
                padding: 24px 16px;
            }

            .brand-logo {
                max-width: 95px;
            }

            .header-section h1 {
                font-size: 1.25rem;
            }

            .policy-item {
                font-size: 0.88rem;
                padding: 10px 12px;
            }

            .icon-circle {
                width: 32px;
                height: 32px;
                font-size: 0.85rem;
            }

            .back-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="policy-container">
        <div class="header-section">
            <!-- مسار اللوجو الخاص بمتجرك -->
            <img src="/imges/PNG.Logo.JPG.jpeg" alt="Kesaa Store Logo" class="brand-logo">
            <h1>سياسة الاسترجاع والاستبدال 🤍</h1>
        </div>

        <ul class="policy-list">
            <li class="policy-item">
                <div class="icon-circle"><i class="fa-solid fa-eye"></i></div>
                <span class="typewriter-text" data-text="حرصًا على راحتك، بنوفر لكِ إمكانية معاينة الأوردر عند الاستلام قبل الدفع."></span>
            </li>
            <li class="policy-item">
                <div class="icon-circle"><i class="fa-solid fa-bag-shopping"></i></div>
                <span class="typewriter-text" data-text="لو المنتج مناسبك، تستلمي الأوردر وتدفعي قيمته بالكامل."></span>
            </li>
            <li class="policy-item">
                <div class="icon-circle"><i class="fa-solid fa-truck"></i></div>
                <span class="typewriter-text" data-text="لو المنتج مش مناسبك، تقدري ترفضي الاستلام، وفي الحالة دي بتدفعي قيمة الشحن فقط."></span>
            </li>
            <li class="policy-item warning">
                <div class="icon-circle"><i class="fa-solid fa-circle-exclamation"></i></div>
                <span class="typewriter-text" data-text="بمجرد استلام الأوردر ودفع قيمته، لا يمكن إرجاع أو استبدال المنتج."></span>
            </li>
            <li class="policy-item">
                <div class="icon-circle"><i class="fa-solid fa-ruler"></i></div>
                <span class="typewriter-text" data-text="برجاء التأكد من المقاس واللون والتفاصيل أثناء المعاينة قبل الاستلام."></span>
            </li>
        </ul>

        <div class="guarantee-banner" id="footerNote">
            هدفنا إنك تستلمي المنتج وإنتِ مطمنة وراضية عنه 🤍
        </div>

        <div class="back-btn-wrapper">
            <a href="index.html" class="back-btn"> العودة للمتجر</a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const elements = document.querySelectorAll('.typewriter-text');
            let currentElementIndex = 0;

            function typeNextElement() {
                if (currentElementIndex >= elements.length) {
                    document.getElementById('footerNote').style.opacity = '1';
                    return;
                }

                const element = elements[currentElementIndex];
                const textToType = element.getAttribute('data-text');
                element.classList.add('typing-cursor');
                let charIndex = 0;

                const interval = setInterval(() => {
                    if (charIndex < textToType.length) {
                        element.textContent += textToType.charAt(charIndex);
                        charIndex++;
                    } else {
                        clearInterval(interval);
                        element.classList.remove('typing-cursor');
                        currentElementIndex++;
                        setTimeout(typeNextElement, 200);
                    }
                }, 18);
            }

            typeNextElement();
        });
    </script>
</body>
</html>
