<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - كساء</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --main-blue: #4a7c59;
            --soft-blue: #7097b7;
            --light-blue: #f2dcdb;
            --dark-text: #2c3e50;
            --accent-pink: #db7a8e;
            --bg-light: #f8fafc;
            --card-bg-light: #ffffff;
            --border-light: #e2e8f0;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 30px 25px;
            background: var(--card-bg-light);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-light);
            position: relative;
            transition: all 0.3s ease;
        }

        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: transparent;
            border: none;
            font-size: 1.2rem;
            color: var(--dark-text);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, color 0.3s ease;
        }

        .theme-toggle-btn:hover { transform: scale(1.1); }

        .auth-header {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        .auth-header h2 {
            color: var(--dark-text);
            font-size: 22px;
            font-weight: 700;
            margin: 0;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-light);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            color: #718096;
            transition: all 0.3s ease;
            position: relative;
            bottom: -2px;
        }

        .tab-btn:hover { color: var(--soft-blue); }
        .tab-btn.active {
            color: var(--accent-pink);
            border-bottom: 3px solid var(--accent-pink);
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 14px;
        }

        .auth-form.active {
            display: flex;
            animation: fadeIn 0.4s ease-in-out;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--dark-text);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            right: 14px;
            color: #a0aec0;
            font-size: 16px;
            transition: color 0.3s ease;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 42px 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            background: #f8fafc;
            color: var(--dark-text);
            transition: all 0.3s ease;
            -webkit-appearance: none;
        }

        .input-wrapper input:focus {
            border-color: var(--soft-blue);
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(112, 151, 183, 0.15);
        }

        .input-wrapper input:focus + i,
        .input-wrapper input:focus ~ i { color: var(--soft-blue); }

        .forgot-pass {
            font-size: 12.5px;
            color: var(--soft-blue);
            text-align: left;
            text-decoration: none;
            margin-top: 4px;
            transition: color 0.2s ease;
        }

        .forgot-pass:hover { text-decoration: underline; }

        .auth-submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            background-color: var(--soft-blue);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(112, 151, 183, 0.25);
            -webkit-tap-highlight-color: transparent;
        }

        .auth-submit-btn:active { transform: scale(0.98); }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 15px 0 10px 0;
            color: #a0aec0;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-light);
        }

        .divider span { padding: 0 10px; }

        .google-btn {
            width: 100%;
            padding: 12px;
            background-color: #ffffff;
            color: #2c3e50;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 14.5px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            -webkit-tap-highlight-color: transparent;
        }

        .google-btn:active {
            transform: scale(0.98);
            background-color: #f1f5f9;
        }

        .google-icon {
            width: 18px;
            height: 18px;
        }

        body.dark-mode {
            background-color: #0f172a;
            --dark-text: #f8fafc;
            --border-light: #334155;
        }

        body.dark-mode .auth-container {
            background: #1e293b;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        body.dark-mode .theme-toggle-btn { color: #f8fafc; }
        body.dark-mode .tab-btn { color: #94a3b8; }
        body.dark-mode .input-wrapper input {
            background: #0f172a;
            border-color: #334155;
            color: #f8fafc;
        }

        body.dark-mode .input-wrapper input:focus {
            background: #1e293b;
            border-color: var(--soft-blue);
        }

        body.dark-mode .input-wrapper i { color: #64748b; }
        body.dark-mode .google-btn {
            background-color: #0f172a;
            color: #f8fafc;
            border-color: #334155;
        }

        body.dark-mode .google-btn:active { background-color: #1a233a; }
        body.dark-mode .forgot-pass { color: #93c5fd; }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .auth-container { padding: 22px 18px; border-radius: 16px; }
            .auth-header h2 { font-size: 20px; }
            .tab-btn { font-size: 14px; padding: 8px; }
            .google-btn { font-size: 13.5px; padding: 11px; }
            .auth-submit-btn { font-size: 15px; padding: 12px; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <button id="dark-mode-toggle" class="theme-toggle-btn" title="تبديل الوضع">
            <i id="mode-icon" class="fa-solid fa-moon"></i>
        </button>

        <div class="auth-header">
            <h2>مرحباً بك في كساء 🌸</h2>
        </div>

        <div class="auth-tabs">
            <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
            <button class="tab-btn" onclick="switchTab('register')">حساب جديد</button>
        </div>

        <button class="google-btn" onclick="loginWithGoogle()">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            المتابعة بواسطة Google
        </button>

        <div class="divider">
            <span>أو عبر البريد</span>
        </div>

        <form id="login-form" class="auth-form active">
            <div class="form-group">
                <label for="login-email">البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input type="email" id="login-email" required placeholder="example@domain.com">
                    <i class="fa-regular fa-envelope"></i>
                </div>
            </div>
            <div class="form-group">
                <label for="login-pass">كلمة السر</label>
                <div class="input-wrapper">
                    <input type="password" id="login-pass" required placeholder="••••••••">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <a href="#" onclick="switchTab('forgot')" class="forgot-pass">نسيت كلمة السر؟</a>
            </div>
            <button type="submit" class="auth-submit-btn">دخول</button>
        </form>

        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="reg-name">الاسم بالكامل</label>
                <div class="input-wrapper">
                    <input type="text" id="reg-name" required placeholder="الاسم الكامل">
                    <i class="fa-regular fa-user"></i>
                </div>
            </div>
            <div class="form-group">
                <label for="reg-email">البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input type="email" id="reg-email" required placeholder="example@domain.com">
                    <i class="fa-regular fa-envelope"></i>
                </div>
            </div>
            <div class="form-group">
                <label for="reg-pass">كلمة السر</label>
                <div class="input-wrapper">
                    <input type="password" id="reg-pass" required placeholder="••••••••">
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>
            <button type="submit" class="auth-submit-btn">إنشاء حساب</button>
        </form>

        <form id="forgot-form" class="auth-form">
            <p style="font-size: 13px; color: #718096; margin: 0 0 5px 0; line-height: 1.5;">أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة ضبط كلمة السر.</p>
            <div class="form-group">
                <label for="forgot-email">البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input type="email" id="forgot-email" required placeholder="example@domain.com">
                    <i class="fa-regular fa-envelope"></i>
                </div>
            </div>
            <button type="submit" class="auth-submit-btn">إرسال رابط الاستعادة</button>
            <a href="#" onclick="switchTab('login')" class="forgot-pass" style="text-align: center; margin-top: 10px;">العودة لـ تسجيل الدخول</a>
        </form>
    </div>

    <!-- استدعاء المكتبات -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/script/main.js"></script>

   <script>
    // 1. استرجاع عميل Supabase بالأسم المعتمد في مشروعك
function getClient() {
    return typeof SupabaseClient !== 'undefined' ? SupabaseClient : (window.SupabaseClient || window.supabase);
}

// 2. إعدادات Dark Mode عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.getElementById('dark-mode-toggle');
    const modeIcon = document.getElementById('mode-icon');

    function applyTheme(isDark) {
        if (isDark) {
            document.body.classList.add('dark-mode');
            if (modeIcon) modeIcon.className = 'fa-solid fa-sun';
        } else {
            document.body.classList.remove('dark-mode');
            if (modeIcon) modeIcon.className = 'fa-solid fa-moon';
        }
    }

    const savedTheme = localStorage.getItem('theme');
    applyTheme(savedTheme === 'dark');

    if (toggleBtn) {
        toggleBtn.onclick = () => {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            applyTheme(isDark);
        };
    }
});

// 3. التبديل بين نماذج الدخول، التسجيل، ونسيت كلمة السر
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.auth-form').forEach(f => {
        f.classList.remove('active');
        f.style.display = 'none';
    });

    if (tab === 'login') {
        const loginTab = document.querySelectorAll('.tab-btn')[0];
        const loginForm = document.getElementById('login-form');
        if (loginTab) loginTab.classList.add('active');
        if (loginForm) {
            loginForm.classList.add('active');
            loginForm.style.display = 'flex';
        }
    } else if (tab === 'register') {
        const regTab = document.querySelectorAll('.tab-btn')[1];
        const regForm = document.getElementById('register-form');
        if (regTab) regTab.classList.add('active');
        if (regForm) {
            regForm.classList.add('active');
            regForm.style.display = 'flex';
        }
    } else if (tab === 'forgot') {
        const forgotForm = document.getElementById('forgot-form');
        if (forgotForm) {
            forgotForm.classList.add('active');
            forgotForm.style.display = 'flex';
        }
    }
}

// 4. تسجيل الدخول بواسطة Google (الكود الأصلي السليم)
async function loginWithGoogle() {
    try {
        const client = getClient();
        if (!client || !client.auth) {
            throw new Error("لم يتم العثور على إعدادات Supabase في الصفحة.");
        }

        const { data, error } = await client.auth.signInWithOAuth({
            provider: 'google',
            options: {
                redirectTo: window.location.origin + '/index.html'
            }
        });

        if (error) throw error;
    } catch (err) {
        console.error("Google Login Error:", err);
        alert("حدث خطأ أثناء تسجيل الدخول بـ Google: " + err.message);
    }
}

// 5. إنشاء حساب جديد بالبريد الإلكتروني
document.getElementById('register-form')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-pass').value;
    const fullName = document.getElementById('reg-name').value.trim();

    try {
        const client = getClient();
        const { data, error } = await client.auth.signUp({
            email: email,
            password: password,
            options: {
                data: { full_name: fullName },
                emailRedirectTo: window.location.origin + '/index.html'
            }
        });

        if (error) throw error;

        alert("تم إنشاء الحساب بنجاح! يمكنك الآن تسجيل الدخول.");
        switchTab('login');
    } catch (err) {
        alert("خطأ في إنشاء الحساب: " + err.message);
    }
});

// 6. تسجيل الدخول بالبريد الإلكتروني
document.getElementById('login-form')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-pass').value;

    try {
        const client = getClient();
        const { data, error } = await client.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) throw error;
        window.location.href = 'index.html';
    } catch (err) {
        alert("خطأ في تسجيل الدخول: " + err.message);
    }
});

// 7. استعادة كلمة السر
document.getElementById('forgot-form')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('forgot-email').value.trim();

    try {
        const client = getClient();
        const { data, error } = await client.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/index.html',
        });

        if (error) throw error;
        alert("تم إرسال رابط إعادة ضبط كلمة السر إلى بريدك الإلكتروني.");
        switchTab('login');
    } catch (err) {
        alert("خطأ: " + err.message);
    }
});
   </script>
</body>
</html>
